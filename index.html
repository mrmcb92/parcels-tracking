<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parcel Tracking</title>
    <meta name="description" content="Tracker personal pentru colete și AWB-uri" />
    <meta name="theme-color" content="#16033a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Parcels" />
    <link rel="manifest" href="/parcels-tracking/manifest.json" />
    <link rel="apple-touch-icon" sizes="192x192" href="/parcels-tracking/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/parcels-tracking/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/parcels-tracking/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/parcels-tracking/sw.js");
        });
      }
    </script>
  </body>
</html>
